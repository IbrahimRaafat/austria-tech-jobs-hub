name: Daily Austria Tech Jobs Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (08:00 AM Vienna time - CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover tests

      - name: Keep previous jobs for new-job alerts
        run: cp data/jobs.json "$RUNNER_TEMP/previous_jobs.json" || true

      - name: Run Job & Thesis Scrapers
        run: |
          python scripts/fetch_jobs.py
          python scripts/fetch_theses.py

      - name: Commit and Push Updated Jobs & Theses Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json data/theses.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update English tech jobs and master theses data [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)

      # After the data push, so a Telegram problem never blocks the board update.
      - name: Send Telegram alerts for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_FILTERS: ${{ vars.ALERT_FILTERS }}
        run: python scripts/send_alerts.py --previous "$RUNNER_TEMP/previous_jobs.json"
