name: Daily Austria Tech Jobs Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (08:00 AM Vienna time - CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Job Scraper
        run: |
          python scripts/fetch_jobs.py

      - name: Commit and Push Updated Jobs Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update English tech jobs data [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
